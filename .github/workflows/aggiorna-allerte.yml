name: Aggiorna allerte meteo

on:
  schedule:
    - cron: "0,30 12,13,14,15,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Esegui lo script delle allerte
        run: python scripts/fetch_allerte.py

      - name: Esegui lo script delle previsioni
        run: python scripts/fetch_previsioni.py

      - name: Salva i dati aggiornati, se cambiati
        run: |
          git config user.name "Robot allerte meteo"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/allerte.json docs/data/previsioni.json
          git diff --staged --quiet && echo "Nessuna modifica, salto il commit" || git commit -m "Aggiornamento automatico bollettino allerte e previsioni"
          git push
